name: wails-release
on:
  push:
    tags: ["v*"]
concurrency:
  group: wails-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  actions: read
  contents: read
jobs:
  publish-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tagged source and release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: source/go.mod
          cache: false
      - name: Find the successful native system run for this exact tag commit
        id: system-run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          test "$(printf '%s' "$SOURCE_COMMIT" | wc -c)" -eq 40
          run_id="$(gh api "repos/${{ github.repository }}/actions/workflows/multiplatform-system.yml/runs?head_sha=$SOURCE_COMMIT&status=success&per_page=100" --jq '[.workflow_runs[] | select(.head_sha == "'"$SOURCE_COMMIT"'" and .conclusion == "success")][0].id // empty')"
          test -n "$run_id"
          test "$(gh api "repos/${{ github.repository }}/actions/runs/$run_id" --jq .path)" = .github/workflows/multiplatform-system.yml
          echo "id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download every exact tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in core-windows-artifact core-darwin-artifact core-linux-amd64-artifact core-linux-arm64-artifact; do
            gh run download "${{ steps.system-run.outputs.id }}" --repo "${{ github.repository }}" --name "$artifact" --dir "tested/$artifact"
          done
          chmod +x tested/core-darwin-artifact/sok tested/core-darwin-artifact/soksak.app/Contents/MacOS/soksak
          chmod +x tested/core-linux-amd64-artifact/sok tested/core-linux-amd64-artifact/soksak
          chmod +x tested/core-linux-arm64-artifact/sok tested/core-linux-arm64-artifact/soksak
      - name: Package and verify the application release
        run: |
          run_id=${{ steps.system-run.outputs.id }}
          jq -n \
            --arg run "$run_id" \
            --arg root "$PWD" \
            '{targets:[
              {platform:"windows",architecture:"x86_64",systemRunId:$run,signing:"unsigned",application:($root+"/tested/core-windows-artifact/soksak.exe"),client:($root+"/tested/core-windows-artifact/sok.exe")},
              {platform:"darwin",architecture:"universal",systemRunId:$run,signing:"ad-hoc",application:($root+"/tested/core-darwin-artifact/soksak.app"),client:($root+"/tested/core-darwin-artifact/sok")},
              {platform:"linux",architecture:"x86_64",systemRunId:$run,signing:"unsigned",application:($root+"/tested/core-linux-amd64-artifact/soksak"),client:($root+"/tested/core-linux-amd64-artifact/sok")},
              {platform:"linux",architecture:"arm64",systemRunId:$run,signing:"unsigned",application:($root+"/tested/core-linux-arm64-artifact/soksak"),client:($root+"/tested/core-linux-arm64-artifact/sok")}
            ]}' > release-inputs.json
          go -C source run ./cmd/package-release \
            --root . \
            --out ../dist-release \
            --source-commit "${{ github.sha }}" \
            --inputs ../release-inputs.json
          (cd dist-release && sha256sum --check SHA256SUMS)
          test "$(jq -r .sourceCommit dist-release/provenance.json)" = "${{ github.sha }}"
          test "$(jq '.targets | length == 4' dist-release/provenance.json)" = true
      - id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.SOKSAK_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.SOKSAK_RELEASE_PRIVATE_KEY }}
          owner: soksak-ai
          repositories: soksak
          permission-administration: read
          permission-contents: write
      - name: Publish the immutable GitHub Release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          test "$(gh api "repos/${{ github.repository }}/immutable-releases" --jq '.enabled and .enforced_by_owner')" = true
          version="$(tr -d '\n' < source/VERSION)"
          test "${{ github.ref_name }}" = "v$version"
          test "$(jq -r .tag dist-release/provenance.json)" = "${{ github.ref_name }}"
          test -z "$(gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json tagName --jq .tagName 2>/dev/null || true)"
          gh release create "${{ github.ref_name }}" \
            dist-release/soksak-"$version"-windows-x86_64.zip \
            dist-release/soksak-"$version"-darwin-universal.tar.gz \
            dist-release/soksak-"$version"-linux-x86_64.tar.gz \
            dist-release/soksak-"$version"-linux-arm64.tar.gz \
            dist-release/SHA256SUMS \
            dist-release/provenance.json \
            dist-release/RELEASE-NOTES.md \
            dist-release/RELEASE-NOTES.ko.md \
            --repo "${{ github.repository }}" \
            --target "$SOURCE_COMMIT" \
            --title "Soksak $version" \
            --notes-file dist-release/RELEASE-NOTES.md
