name: wails-release
on:
  push:
    tags: ["v*"]
concurrency:
  group: wails-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  actions: read
  contents: read
jobs:
  publish-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tagged source and release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.0"
          cache: false
      - name: Find the successful native system run for this exact tag commit
        id: system-run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          test "$(printf '%s' "$SOURCE_COMMIT" | wc -c)" -eq 40
          run_id="$(gh api "repos/${{ github.repository }}/actions/workflows/windows-terminal-system.yml/runs?head_sha=$SOURCE_COMMIT&status=success&per_page=100" --jq '[.workflow_runs[] | select(.head_sha == "'"$SOURCE_COMMIT"'" and .conclusion == "success")][0].id // empty')"
          test -n "$run_id"
          test "$(gh api "repos/${{ github.repository }}/actions/runs/$run_id" --jq .path)" = .github/workflows/windows-terminal-system.yml
          echo "id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download the exact tested Windows binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ steps.system-run.outputs.id }}" --repo "${{ github.repository }}" --name core-windows-artifact --dir tested
      - name: Package and verify the application release
        run: |
          go -C source run ./cmd/package-release \
            --root . \
            --out ../dist-release \
            --source-commit "${{ github.sha }}" \
            --system-run-id "${{ steps.system-run.outputs.id }}" \
            --app ../tested/soksak.exe \
            --cli ../tested/sok.exe
          (cd dist-release && sha256sum --check SHA256SUMS)
          test "$(jq -r .sourceCommit dist-release/provenance.json)" = "${{ github.sha }}"
          test "$(jq -r .authenticode dist-release/provenance.json)" = unsigned
      - id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.SOKSAK_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.SOKSAK_RELEASE_PRIVATE_KEY }}
          owner: soksak-ai
          repositories: soksak
          permission-administration: read
          permission-contents: write
      - name: Publish the immutable GitHub Release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          test "$(gh api "repos/${{ github.repository }}/immutable-releases" --jq '.enabled and .enforced_by_owner')" = true
          version="$(jq -r .version source/frontend/package.json)"
          test "${{ github.ref_name }}" = "v$version"
          test "$(jq -r .tag dist-release/provenance.json)" = "${{ github.ref_name }}"
          test -z "$(gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json tagName --jq .tagName 2>/dev/null || true)"
          gh release create "${{ github.ref_name }}" \
            dist-release/soksak-"$version"-windows-x86_64.zip \
            dist-release/SHA256SUMS \
            dist-release/provenance.json \
            dist-release/RELEASE-NOTES.md \
            dist-release/RELEASE-NOTES.ko.md \
            --repo "${{ github.repository }}" \
            --target "$SOURCE_COMMIT" \
            --title "Soksak $version" \
            --notes-file dist-release/RELEASE-NOTES.md
