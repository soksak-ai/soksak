# 3-OS cargo check matrix. All three OS columns went green (run 29506546092:
# sibling capture fixes + core titlebar/pty gates + the W2 M0 Windows IPC
# transport), so the documented removal condition is met: continue-on-error is
# dropped and this check now fails the workflow when any OS regresses.
name: multiplatform-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cargo-check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out the app repository
        uses: actions/checkout@v4
        with:
          path: soksak

      # Same sibling layout as verify.yml: src-tauri/Cargo.toml declares
      # tauri-plugin-webview-capture by relative path, two levels up from
      # src-tauri. The crate repository is public, so the default checkout
      # (no token) resolves it — CI_REPO_TOKEN is no longer required.
      - name: Check out the sibling path dependency
        uses: actions/checkout@v4
        with:
          repository: soksak-ai/tauri-plugin-webview-capture
          path: tauri-plugin-webview-capture

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: soksak/src-tauri

      # Mirrors `make check` (cd src-tauri && cargo check); invoked directly
      # because GNU make is not present on the Windows runner.
      - name: cargo check
        id: check
        shell: bash
        working-directory: soksak/src-tauri
        run: |
          set -o pipefail
          cargo check 2>&1 | tee cargo-check.log

      - name: Write the result to the job summary
        if: always()
        shell: bash
        working-directory: soksak/src-tauri
        run: |
          {
            echo "## cargo check — ${{ matrix.os }}"
            echo ""
            echo "outcome: **${{ steps.check.outcome }}**"
            echo ""
            echo '```'
            tail -n 100 cargo-check.log 2>/dev/null || echo "(no log produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-check-${{ matrix.os }}
          path: soksak/src-tauri/cargo-check.log
          if-no-files-found: warn
