name: windows-terminal-system
on:
  workflow_dispatch:
  push:
    branches: [wails3beta-terminal-0.0.1]
    paths:
      - ".github/workflows/windows-terminal-system.yml"
      - ".github/workflows/wails-release.yml"
      - "cmd/package-release/**"
      - "build/windows/**"
      - "cmd/sok/**"
      - "core/**"
      - "frameworks/**"
      - "frontend/**"
      - "scripts/ci/windows-build.sh"
      - "go.mod"
      - "go.sum"
      - "launch.go"
      - "login_shell_*.go"
      - "main.go"
      - "pid_*.go"
      - "process_sink.go"
      - "repository_boundary.go"
      - "system_key_store*.go"
      - "tracked_record_files.go"
permissions:
  contents: read
  actions: read
jobs:
  build-core:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { path: soksak-core, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { repository: soksak-ai/soksak-contract-contentview, ref: 5af66117202f6934ecd2909199bf9b84a541e523, path: soksak-contracts/soksak-contract-contentview }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { repository: soksak-ai/soksak-contract-control, ref: f12f3a6f579b6dff04622a0138450e75d2afae7c, path: soksak-contracts/soksak-contract-control }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { repository: soksak-ai/soksak-contract-pty, ref: b19af1c4e28a294d18bedbd17405dd5034b0901f, path: soksak-contracts/soksak-contract-pty }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { repository: soksak-ai/soksak-contract-terminal, ref: cab0691a1a01fca7436ac29f6cc2850245788ea6, path: soksak-contracts/soksak-contract-terminal }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.0"
          cache-dependency-path: soksak-core/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: "24.19.0" }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { version: "10.30.3" }
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.12
          "WAILS3=$(Join-Path (go env GOPATH) 'bin/wails3.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - shell: bash
        working-directory: soksak-core
        run: scripts/ci/windows-build.sh all
      - shell: pwsh
        run: |
          foreach ($artifact in 'soksak-core/bin/soksak.exe','soksak-core/bin/sok.exe') {
            if (!(Test-Path $artifact)) { throw "missing Windows artifact: $artifact" }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-windows-artifact
          path: |
            soksak-core/bin/soksak.exe
            soksak-core/bin/sok.exe
          if-no-files-found: error
          compression-level: 0
  system:
    needs: build-core
    # Cross-owner reusable workflows must be public; the fleet repository contains tests only.
    uses: min-median-max/soksak-terminal-tests/.github/workflows/windows-system.yml@b8d9f83580ace24aa9692d7d8127e078463cf366
    with:
      tests_ref: b8d9f83580ace24aa9692d7d8127e078463cf366
