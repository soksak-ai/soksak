name: multiplatform-system
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { path: soksak-core, persist-credentials: false }
      - shell: bash
        run: soksak-core/scripts/ci/require-disk-capacity.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: { go-version-file: soksak-core/go.mod, cache-dependency-path: soksak-core/go.sum }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: soksak-core/frontend/package.json }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { package_json_file: soksak-core/frontend/package.json }
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.12
          "WAILS3=$(Join-Path (go env GOPATH) 'bin/wails3.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - shell: bash
        working-directory: soksak-core
        run: scripts/ci/windows-build.sh all
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-windows-artifact
          path: |
            soksak-core/bin/soksak.exe
            soksak-core/bin/sok.exe
          if-no-files-found: error
          compression-level: 0
  darwin-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { path: soksak-core, persist-credentials: false }
      - run: soksak-core/scripts/ci/require-disk-capacity.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: { go-version-file: soksak-core/go.mod, cache-dependency-path: soksak-core/go.sum }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: soksak-core/frontend/package.json }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { package_json_file: soksak-core/frontend/package.json }
      - working-directory: soksak-core
        run: scripts/ci/darwin-release.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-darwin-artifact
          path: soksak-core/bin/release/darwin-universal/
          if-no-files-found: error
          compression-level: 0
  linux-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { path: soksak-core, persist-credentials: false }
      - run: soksak-core/scripts/ci/require-disk-capacity.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: { go-version-file: soksak-core/go.mod, cache-dependency-path: soksak-core/go.sum }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: soksak-core/frontend/package.json }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { package_json_file: soksak-core/frontend/package.json }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev binutils
      - working-directory: soksak-core
        run: scripts/ci/linux-release.sh ${{ matrix.architecture }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-linux-${{ matrix.architecture }}-artifact
          path: soksak-core/bin/release/linux-${{ matrix.architecture }}/
          if-no-files-found: error
          compression-level: 0
  windows-system:
    needs: windows-build
    uses: min-median-max/soksak-terminal-tests/.github/workflows/windows-system.yml@5c75a7fe40903632a8673eca8c035891d4c84752
    with: { tests_ref: 5c75a7fe40903632a8673eca8c035891d4c84752 }
  darwin-system:
    needs: darwin-build
    uses: min-median-max/soksak-terminal-tests/.github/workflows/darwin-system.yml@5c75a7fe40903632a8673eca8c035891d4c84752
    with: { tests_ref: 5c75a7fe40903632a8673eca8c035891d4c84752 }
  linux-system:
    needs: linux-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            architecture: arm64
            target: aarch64-unknown-linux-gnu
    uses: min-median-max/soksak-terminal-tests/.github/workflows/linux-system.yml@5c75a7fe40903632a8673eca8c035891d4c84752
    with:
      tests_ref: 5c75a7fe40903632a8673eca8c035891d4c84752
      runner: ${{ matrix.runner }}
      architecture: ${{ matrix.architecture }}
      target: ${{ matrix.target }}
