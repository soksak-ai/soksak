name: multiplatform-system
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { path: soksak-core, persist-credentials: false }
      - shell: bash
        run: soksak-core/scripts/ci/require-disk-capacity.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: { go-version-file: soksak-core/go.mod, cache-dependency-path: soksak-core/go.sum }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: soksak-core/.node-version }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { package_json_file: soksak-core/frontend/package.json }
      - shell: powershell
        run: choco install make --version=4.4.1 --no-progress --yes
      - shell: bash
        working-directory: soksak-core
        run: go tool wails3 version
      - shell: bash
        working-directory: soksak-core
        run: make build TARGET=x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-windows-artifact
          path: |
            soksak-core/bin/soksak.exe
            soksak-core/bin/sok.exe
          if-no-files-found: error
          compression-level: 0
  darwin-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            architecture: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { path: soksak-core, persist-credentials: false }
      - run: soksak-core/scripts/ci/require-disk-capacity.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: { go-version-file: soksak-core/go.mod, cache-dependency-path: soksak-core/go.sum }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: soksak-core/.node-version }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { package_json_file: soksak-core/frontend/package.json }
      - working-directory: soksak-core
        run: |
          make build TARGET="${{ matrix.target }}"
          make build TARGET="${{ matrix.target }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-darwin-${{ matrix.architecture }}-artifact
          path: soksak-core/bin/release/darwin-${{ matrix.architecture }}/
          if-no-files-found: error
          compression-level: 0
  darwin-compose:
    needs: darwin-build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { path: soksak-core, persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: core-darwin-arm64-artifact
          path: soksak-core/bin/release/darwin-arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: core-darwin-x86_64-artifact
          path: soksak-core/bin/release/darwin-x86_64
      - working-directory: soksak-core
        run: |
          make compose TARGET=universal-apple-darwin
          make compose TARGET=universal-apple-darwin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-darwin-artifact
          path: soksak-core/bin/release/darwin-universal/
          if-no-files-found: error
          compression-level: 0
  darwin-candidate-native-input:
    needs: darwin-build
    uses: min-median-max/soksak-terminal-tests/.github/workflows/darwin-candidate-native-input.yml@ebbc169a68d3203ecb5c703db9dfad641c8c2777
    with:
      tests_repository: min-median-max/soksak-terminal-tests
      tests_ref: ebbc169a68d3203ecb5c703db9dfad641c8c2777
      core_artifact_name: core-darwin-arm64-artifact
      core_source_commit: ${{ github.sha }}
  linux-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            architecture: arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { path: soksak-core, persist-credentials: false }
      - run: soksak-core/scripts/ci/require-disk-capacity.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: { go-version-file: soksak-core/go.mod, cache-dependency-path: soksak-core/go.sum }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version-file: soksak-core/.node-version }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { package_json_file: soksak-core/frontend/package.json }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev binutils
      - working-directory: soksak-core
        run: make build TARGET="${{ matrix.target }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-linux-${{ matrix.architecture }}-artifact
          path: soksak-core/bin/release/linux-${{ matrix.architecture }}/
          if-no-files-found: error
          compression-level: 0
  windows-system:
    needs: windows-build
    uses: min-median-max/soksak-terminal-tests/.github/workflows/windows-system.yml@6ea6109abc286f5ecfbde7b2460af51586e16267
    with: { tests_ref: 6ea6109abc286f5ecfbde7b2460af51586e16267 }
  darwin-system:
    needs: [darwin-build, darwin-compose]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: core-darwin-arm64-artifact
            architecture: arm64
            target: aarch64-apple-darwin
            variant: thin
          - runner: macos-15-intel
            artifact: core-darwin-x86_64-artifact
            architecture: x86_64
            target: x86_64-apple-darwin
            variant: thin
          - runner: macos-15
            artifact: core-darwin-artifact
            architecture: arm64
            target: aarch64-apple-darwin
            variant: universal
          - runner: macos-15-intel
            artifact: core-darwin-artifact
            architecture: x86_64
            target: x86_64-apple-darwin
            variant: universal
    uses: min-median-max/soksak-terminal-tests/.github/workflows/darwin-system.yml@6ea6109abc286f5ecfbde7b2460af51586e16267
    with:
      tests_ref: 6ea6109abc286f5ecfbde7b2460af51586e16267
      runner: ${{ matrix.runner }}
      artifact: ${{ matrix.artifact }}
      architecture: ${{ matrix.architecture }}
      target: ${{ matrix.target }}
      variant: ${{ matrix.variant }}
  linux-system:
    needs: linux-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            architecture: arm64
            target: aarch64-unknown-linux-gnu
    uses: min-median-max/soksak-terminal-tests/.github/workflows/linux-system.yml@6ea6109abc286f5ecfbde7b2460af51586e16267
    with:
      tests_ref: 6ea6109abc286f5ecfbde7b2460af51586e16267
      runner: ${{ matrix.runner }}
      architecture: ${{ matrix.architecture }}
      target: ${{ matrix.target }}
