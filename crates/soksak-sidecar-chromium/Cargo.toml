# soksak-sidecar-chromium — Chromium 엔진 사이드카(engine 모델, in-process dylib).
# 코어는 이 크레이트를 링크하지 않는다 — 런타임 dlopen(코어 sidecar.rs) + C ABI(soksak-engine-abi@1).
# 서드파티 임베딩 라이브러리 `cef`(CEF)의 이름은 이 크레이트 안에만 존재한다(docs/NAMING.md §2).
[package]
name = "soksak-sidecar-chromium"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

# CEF 서브프로세스(renderer/GPU/utility) 전용 helper — LibraryLoader(helper)+execute_process 만.
[[bin]]
name = "soksak-sidecar-chromium-helper"
path = "src/bin/helper.rs"

[dependencies]
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Chromium 임베딩(CEF) — 프레임워크는 정적 링크가 아니라 런타임 dlopen(LibraryLoader).
cef = { version = "149.3.0", default-features = false }
objc2 = "0.6"
objc2-foundation = "0.3"

# 독립 워크스페이스 — 코어(src-tauri) 워크스페이스와 분리(cargo 는 멤버가 루트 하위여야 해서 형제
# 디렉토리 편입 불가). 빌드·스테이징은 make sidecar-chromium 이 소유.
[workspace]
