<!DOCTYPE html>
<html lang="en" data-boot-status="loading">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/wails.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Wails + React + TS</title>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <div id="root"></div>
    <pre id="boot-error" data-boot-error hidden style="position:fixed;inset:24px;z-index:2147483647;overflow:auto;padding:20px;background:#170b0b;color:#ffb4b4;border:1px solid #ff6b6b;white-space:pre-wrap"></pre>
    <script>
      (() => {
        const publish = (value) => {
          // Message and stack together. Some browsers leave the message out of
          // stack, and the report is then "RuntimeError" alone, which diagnoses
          // nothing (measured 2026-08-15).
          const message = value instanceof Error
            ? [value.name + ": " + value.message, value.stack].filter(Boolean).join("\n")
            : String(value);
          if (document.documentElement.dataset.bootStatus !== "loading") {
            document.documentElement.dataset.runtimeError = message;
            return;
          }
          document.documentElement.dataset.bootStatus = "failed";
          document.documentElement.dataset.bootError = message;
          const output = document.querySelector("[data-boot-error]");
          if (output) {
            output.hidden = false;
            output.textContent = `soksak-core bootstrap failed\n\n${message}`;
          }
        };
        window.addEventListener("error", (event) => publish(event.error || event.message));
        window.addEventListener("unhandledrejection", (event) => publish(event.reason));
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
