<!DOCTYPE html>
<html lang="en" data-boot-status="loading">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/wails.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>soksak</title>
    <style>
      /* The boot failure screen. It has to stand before the app stylesheet loads, so it is here.
         Its own name: the diagnosis is recorded on <html> as data-boot-error, and an attribute
         selector matches any element carrying it — so the screen's rules landed on the document
         element too and inset the whole application by this padding. Measured 2026-08-17, by a
         person reading the inspector: data-boot-status="failed" and 40px of padding on <html>. */
      [data-boot-screen] {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 40px;
        background: #0f1014;
        color: #e6e6ea;
        font: 13px/1.6 ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif;
        text-align: center;
      }
      [data-boot-screen][data-shown] { display: flex; }
      [data-boot-screen] h1 { margin: 0; font-size: 15px; font-weight: 600; }
      [data-boot-screen] p { margin: 0; max-width: 46ch; color: #9b9ba6; }
      [data-boot-facts] {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 6px 12px;
        width: min(560px, 100%);
        padding: 14px;
        border: 1px solid #2a2b33;
        border-radius: 8px;
        background: #17181d;
        text-align: left;
      }
      [data-boot-facts] dt { color: #9b9ba6; }
      [data-boot-facts] dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
      [data-boot-screen] details { width: min(560px, 100%); text-align: left; }
      [data-boot-screen] summary { color: #9b9ba6; cursor: pointer; }
      [data-boot-diagnostics] {
        max-height: 180px;
        margin: 8px 0 0;
        overflow: auto;
        padding: 10px;
        border-radius: 6px;
        background: #090a0d;
        color: #c9c9d2;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        user-select: text;
      }
      [data-boot-screen] code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #c9c9d2;
      }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <div id="root"></div>
    <div data-boot-screen role="alert">
      <h1 data-boot-title></h1>
      <p data-boot-detail></p>
      <dl data-boot-facts>
        <dt data-boot-code-label></dt><dd><code data-boot-code></code></dd>
        <dt data-boot-phase-label></dt><dd><code data-boot-phase></code></dd>
        <dt data-boot-message-label></dt><dd data-boot-message></dd>
      </dl>
      <details>
        <summary data-boot-diagnostics-label></summary>
        <pre data-boot-diagnostics></pre>
      </details>
      <p data-boot-command></p>
    </div>
    <script>
      (() => {
        // The two sentences a person reads. The app's key table is not loaded
        // yet — this screen stands exactly when the bundle failed to load — so
        // the pair is inline here and selected by the browser's language.
        const KOREAN = navigator.language.startsWith("ko");
        const TITLE = KOREAN ? "앱을 시작하지 못했습니다" : "The application did not start";
        const DETAIL = KOREAN
          ? "시작을 중단한 오류입니다."
          : "This error stopped application startup.";
        const LABELS = KOREAN
          ? { code: "오류 코드", phase: "실패 단계", message: "오류 내용", diagnostics: "기술 세부 정보" }
          : { code: "Error code", phase: "Failed phase", message: "Message", diagnostics: "Technical details" };
        const COMMAND = KOREAN
          ? "추가 상태: sok state.boot"
          : "Additional status: sok state.boot";

        const publish = (value) => {
          // Message and stack together. Some browsers leave the message out of
          // stack, and the report is then "RuntimeError" alone, which diagnoses
          // nothing (measured 2026-08-15).
          const record = value && typeof value === "object" ? value : {};
          const text = value instanceof Error ? value.message : String(value);
          const code = typeof record.code === "string" && record.code ? record.code : "BOOT_FAILURE";
          const phase = typeof record.phase === "string" && record.phase
            ? record.phase
            : document.documentElement.dataset.bootPhase || "loading";
          const diagnostics = value instanceof Error
            ? [value.name + ": " + value.message, value.stack].filter(Boolean).join("\n")
            : text;
          // The diagnosis goes to a data attribute and the console. A stack on
          // screen shows the user what they cannot read and hides what they can.
          console.error("[boot]", diagnostics);
          if (document.documentElement.dataset.bootStatus !== "loading") {
            document.documentElement.dataset.runtimeError = diagnostics;
            return;
          }
          document.documentElement.dataset.bootStatus = "failed";
          document.documentElement.dataset.bootError = code + ": " + text;
          document.documentElement.dataset.bootPhase = phase;
          const screen = document.querySelector("[data-boot-screen]");
          if (!screen) return;
          screen.querySelector("[data-boot-title]").textContent = TITLE;
          screen.querySelector("[data-boot-detail]").textContent = DETAIL;
          screen.querySelector("[data-boot-code-label]").textContent = LABELS.code;
          screen.querySelector("[data-boot-phase-label]").textContent = LABELS.phase;
          screen.querySelector("[data-boot-message-label]").textContent = LABELS.message;
          screen.querySelector("[data-boot-diagnostics-label]").textContent = LABELS.diagnostics;
          screen.querySelector("[data-boot-code]").textContent = code;
          screen.querySelector("[data-boot-phase]").textContent = phase;
          screen.querySelector("[data-boot-message]").textContent = text;
          screen.querySelector("[data-boot-diagnostics]").textContent = diagnostics;
          screen.querySelector("[data-boot-command]").textContent = COMMAND;
          screen.dataset.shown = "";
        };
        window.addEventListener("error", (event) => publish(event.error || event.message));
        window.addEventListener("unhandledrejection", (event) => publish(event.reason));
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
