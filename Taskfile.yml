version: '3'

vars:
  # This repository produces two binaries and no others: the application and the
  # client that drives it from outside. A generic "app" left bin/ holding four
  # names for one program — app, app-mcp, app.dev.app, soksak-app — and the one
  # carrying the framework's MCP server was taken for the real application on
  # screen (measured 2026-08-15).
  APP_NAME: "soksak"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: pnpm
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'
  WAILS3: '{{.WAILS3 | default "wails3"}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  verify:
    summary: Runs every gate. A commit that has not cleared this does not land.
    desc: |
      Gates increase monotonically — each one added stays added, and every later
      commit clears all of them. A gate that cannot block is not a gate.

      This repository runs only its own gates. Dependencies run their gates in
      their owner repositories.
    cmds:
      - task: verify:go
      - task: verify:restore
      - task: verify:quiet
      - task: verify:arrangement
      - task: verify:drawn
      - task: verify:headless
      - task: verify:windows
      - task: verify:frontend

  verify:go:
    summary: Go build, vet, and tests for this module
    cmds:
      - go build ./...
      - go vet ./...
      - go test ./...

  verify:restore:
    summary: The digest before a restart equals the digest after (RESTORE V1)
    desc: |
      Runs the real binaries against a home of its own, so it neither reads nor
      disturbs the store a person is using. It builds them first because a gate
      that skipped when they were stale would be a gate that never ran.

      It quits through `app.shutdown.commit` rather than killing the process. A
      kill skips the drain and the save, and what came back afterwards would be
      the measurement of a crash.
    cmds:
      - task: build
      - task: build:sok
      - go test ./ -run TestTheDigestSurvivesARestart -count=1

  verify:arrangement:
    summary: Each click leaves the arrangement it is meant to
    desc: |
      The base every other layout question stands on. How long a motion takes,
      whether a page travels with its pane, whether a frame blinks — each of
      those asks about a window that is already the right window, and none of
      them was asked first.

      It states the window before measuring it: a terminal above a browser on
      the left, a terminal filling the right, the browser's plugin linked to a
      set holding the browser's own section and the terminals' to theirs. Then
      it clicks each pane twice round and refuses anything but the stated
      arrangement — including whose section is standing, which a region's width
      does not name. Measured 2026-08-17: a browser was focused, a region stood
      beside it, the file tree was in it, and the gate passed.
    deps:
      - task: build
      - task: build:sok
    cmds:
      - go test -count=1 -run TestEachClickLeavesTheArrangementItIsMeantTo -timeout 600s .

  verify:drawn:
    summary: What a link names is what the window draws
    desc: |
      Every test of the standing rule read state or a component on its own, and
      none of them read the window. So the rule held in three places and failed
      on screen more than once — a tab drew one icon while the command reported
      another, and the right region answered OK to a link it never drew. Both
      were found by eye, which is not a verdict (EVIDENCE E1).

      This links a section to the focused view's plugin, region by region, and
      reads the exposed DOM, which addresses a view by the region it is drawn in
      and gives it a rectangle. Drawn is a box a person can see, not a node that
      exists.
    deps:
      - task: build
      - task: build:sok
    cmds:
      - go test -count=1 -run TestWhatTheLinkSaysIsWhatIsDrawn -timeout 600s .

  verify:motion:
    summary: The window keeps drawing while the layout changes
    desc: |
      Run on a machine that is doing nothing else. A window that stops drawing
      while the layout changes is this application's defect; a window that stops
      because four other test binaries are running is not, and the two produce
      the same number. So `task verify` measures it and writes it down, and this
      task is where it fails.

      Measured 2026-08-17 in the named window — a terminal top left, a browser
      under it, a terminal filling the right — the window stopped drawing for 68
      to 114ms on a focus change while drawing every 17 to 19ms once still. The
      paths this build owns cost 1 to 4ms of that, so the rest is the engine's
      own render and paint.
    deps:
      - task: build
      - task: build:sok
    cmds:
      - go test -count=1 -tags motion -run TestEveryWayTheFocusMovesInTheNamedWindow -timeout 900s .

  verify:quiet:
    summary: A running build reports nothing wrong about itself
    desc: |
      Every other gate reads source or a stored record. None of them asks the
      application, so a build can be green while it is failing on screen.

      Measured 2026-08-16: three renderer errors sat in the activity stream
      saying `watch_dir has no filesystem watcher in this build`, the file tree's
      live refresh was dead, and `task verify` was clean. The reading existed and
      nothing read it.

      It installs the sibling plugins into a home of its own, consents, enables,
      opens every program the registry offers, and then asks: the error stream,
      the loader's rejections, the border contract, and whether the activity
      ledger is taking writes.
    cmds:
      - task: build
      - task: build:sok
      - go test ./ -run TestARunningBuildReportsNothingWrong -count=1

  verify:headless:
    summary: The core answers with no window — the boundary a second host needs
    cmds:
      - go test ./core/...

  verify:windows:
    summary: Windows stays cgo-free, so it cross-compiles from any host (N3)
    cmds:
      - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...

  verify:frontend:
    summary: Frontend types and tests, including the seam and coupling gates
    dir: frontend
    cmds:
      - "{{.PACKAGE_MANAGER}} typecheck"
      - "{{.PACKAGE_MANAGER}} test"

  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  clean:
    summary: Removes build artefacts this repository does not produce
    desc: |
      bin/ holds exactly two things: soksak and sok. Anything else there is left
      over from a build that no longer exists, and a stale application binary is
      not inert — it launches, opens a window, and is taken for the current one.

      Measured 2026-08-15: a stale binary carrying the framework's debug server
      put a second window on screen that was read as a defect in the first.
    cmds:
      - |
        for stale in bin/*; do
          case "$(basename "$stale")" in
            soksak|sok) ;;
            *) echo "removing $stale"; rm -rf "$stale" ;;
          esac
        done

  build:sok:
    summary: Builds the control-plane client
    desc: |
      `sok` is how anything outside the application drives it. It builds from
      this module so it derives the socket the same way the application does —
      a second spelling of "where does this installation live" would drift.

      It lands in bin/ beside everything else this repository produces. A copy
      built into a temporary directory is a copy nobody can rebuild the same
      way tomorrow.
    cmds:
      - task: '{{.GOOS}}:build:sok'
        vars:
          TARGET_ARCH: '{{.TARGET_ARCH}}'
          ARCH: '{{.ARCH}}'

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - '"{{.WAILS3}}" dev -config ./build/config.yml -port {{.VITE_PORT}}'

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
