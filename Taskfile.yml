version: '3'

vars:
  # This repository produces two binaries and no others: the application and the
  # client that drives it from outside. A generic "app" left bin/ holding four
  # names for one program — app, app-mcp, app.dev.app, soksak-app — and the one
  # carrying the framework's MCP server was taken for the real application on
  # screen (measured 2026-08-15).
  APP_NAME: "soksak"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: pnpm
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  verify:
    summary: Runs every gate. A commit that has not cleared this does not land.
    desc: |
      Gates increase monotonically — each one added stays added, and every later
      commit clears all of them. A gate that cannot block is not a gate.

      This runs where the work is rather than in CI, because the sibling modules
      this workspace resolves through `replace` have no remotes yet: a workflow
      file would look like a gate and never run. When they gain remotes, CI
      calls this same task.
    cmds:
      - task: verify:go
      - task: verify:restore
      - task: verify:quiet
      - task: verify:headless
      - task: verify:windows
      - task: verify:frontend
      - task: verify:modules

  verify:go:
    summary: Go build, vet, and tests for this module
    cmds:
      - go build ./...
      - go vet ./...
      - go test ./...

  verify:restore:
    summary: The digest before a restart equals the digest after (RESTORE V1)
    desc: |
      Runs the real binaries against a home of its own, so it neither reads nor
      disturbs the store a person is using. It builds them first because a gate
      that skipped when they were stale would be a gate that never ran.

      It quits through `app.shutdown.commit` rather than killing the process. A
      kill skips the drain and the save, and what came back afterwards would be
      the measurement of a crash.
    cmds:
      - task: build
      - task: build:sok
      - go test ./ -run TestTheDigestSurvivesARestart -count=1

  verify:quiet:
    summary: A running build reports nothing wrong about itself
    desc: |
      Every other gate reads source or a stored record. None of them asks the
      application, so a build can be green while it is failing on screen.

      Measured 2026-08-16: three renderer errors sat in the activity stream
      saying `watch_dir has no filesystem watcher in this build`, the file tree's
      live refresh was dead, and `task verify` was clean. The reading existed and
      nothing read it.

      It installs the sibling plugins into a home of its own, consents, enables,
      opens every program the registry offers, and then asks: the error stream,
      the loader's rejections, the border contract, and whether the activity
      ledger is taking writes.
    cmds:
      - task: build
      - task: build:sok
      - go test ./ -run TestARunningBuildReportsNothingWrong -count=1

  verify:headless:
    summary: The core answers with no window — the boundary a second host needs
    cmds:
      - go test ./core/...

  verify:windows:
    summary: Windows stays cgo-free, so it cross-compiles from any host (N3)
    cmds:
      - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...

  verify:frontend:
    summary: Frontend types and tests, including the seam and coupling gates
    dir: frontend
    cmds:
      - "{{.PACKAGE_MANAGER}} typecheck"
      - "{{.PACKAGE_MANAGER}} test"

  verify:modules:
    summary: The sibling modules this one resolves through `replace`
    cmds:
      - for: ["../wails-services/wails-service-native-compositor", "../soksak-plugins/soksak-plugin-browser-native", "../soksak-plugins/soksak-plugin-terminal-xterm"]
        cmd: cd {{.ITEM}} && go vet ./... && go test ./...

  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  clean:
    summary: Removes build artefacts this repository does not produce
    desc: |
      bin/ holds exactly two things: soksak and sok. Anything else there is left
      over from a build that no longer exists, and a stale application binary is
      not inert — it launches, opens a window, and is taken for the current one.

      Measured 2026-08-15: a stale binary carrying the framework's debug server
      put a second window on screen that was read as a defect in the first.
    cmds:
      - |
        for stale in bin/*; do
          case "$(basename "$stale")" in
            soksak|sok) ;;
            *) echo "removing $stale"; rm -rf "$stale" ;;
          esac
        done

  build:sok:
    summary: Builds the control-plane client
    desc: |
      `sok` is how anything outside the application drives it. It builds from
      this module so it derives the socket the same way the application does —
      a second spelling of "where does this installation live" would drift.

      It lands in bin/ beside everything else this repository produces. A copy
      built into a temporary directory is a copy nobody can rebuild the same
      way tomorrow.
    cmds:
      - go build -o bin/sok ./cmd/sok

  install:plugins:
    summary: Puts the sibling plugins in the home this build runs against
    desc: |
      A plugin is read from the installation's home, not from its source tree.
      Without this step a plugin change cannot be run: the source is edited, the
      bundle is rebuilt, and the application keeps loading the copy that was
      placed by hand — with the manifest it had that day.

      Measured 2026-08-16. Four commands were moved out of the core into the
      terminal plugin, the plugin's own tests passed, and the running build kept
      answering with the two it had before. `plugin.conformance` named the cause
      — `declared: [clear, send]` — because it reads the installed manifest,
      which is the right thing for it to read.

      Each plugin builds its own bundle and both files are copied whole. The
      marker states where the copy came from, so an installed tree can be told
      apart from a published one.
    cmds:
      - for:
          [
            "../soksak-plugins/soksak-plugin-browser-native",
            "../soksak-plugins/soksak-plugin-terminal-xterm",
          ]
        cmd: |
          set -e
          name="$(basename "{{.ITEM}}")"
          home="${SOKSAK_HOME:-$HOME/.soksak-wails}"
          if [ -f "{{.ITEM}}/frontend/build.mjs" ]; then
            (cd "{{.ITEM}}/frontend" && node build.mjs)
          fi
          mkdir -p "$home/plugins/$name"
          cp "{{.ITEM}}/main.js" "{{.ITEM}}/plugin.json" "$home/plugins/$name/"
          printf '{"version":"0.0.1","source":"local"}' > "$home/plugins/$name/.soksak.json"
          echo "installed $name into $home/plugins"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
