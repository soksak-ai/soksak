version: '3'

vars:
  # This repository produces two binaries and no others: the application and the
  # client that drives it from outside. A generic "app" left bin/ holding four
  # names for one program — app, app-mcp, app.dev.app, soksak-app — and the one
  # carrying the framework's MCP server was taken for the real application on
  # screen (measured 2026-08-15).
  APP_NAME: "soksak"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: pnpm
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  verify:
    summary: Runs every gate. A commit that has not cleared this does not land.
    desc: |
      Gates increase monotonically — each one added stays added, and every later
      commit clears all of them. A gate that cannot block is not a gate.

      This runs where the work is rather than in CI, because the sibling modules
      this workspace resolves through `replace` have no remotes yet: a workflow
      file would look like a gate and never run. When they gain remotes, CI
      calls this same task.
    cmds:
      - task: verify:go
      - task: verify:headless
      - task: verify:windows
      - task: verify:frontend
      - task: verify:modules

  verify:go:
    summary: Go build, vet, and tests for this module
    cmds:
      - go build ./...
      - go vet ./...
      - go test ./...

  verify:headless:
    summary: The core answers with no window — the boundary a second host needs
    cmds:
      - go test ./core/...

  verify:windows:
    summary: Windows stays cgo-free, so it cross-compiles from any host (N3)
    cmds:
      - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...

  verify:frontend:
    summary: Frontend types and tests, including the seam and coupling gates
    dir: frontend
    cmds:
      - "{{.PACKAGE_MANAGER}} typecheck"
      - "{{.PACKAGE_MANAGER}} test"

  verify:modules:
    summary: The sibling modules this one resolves through `replace`
    cmds:
      - for: ["../wails-service-native-compositor", "../soksak-plugin-browser-native", "../soksak-plugin-terminal-xterm"]
        cmd: cd {{.ITEM}} && go vet ./... && go test ./...

  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  clean:
    summary: Removes build artefacts this repository does not produce
    desc: |
      bin/ holds exactly two things: soksak and sok. Anything else there is left
      over from a build that no longer exists, and a stale application binary is
      not inert — it launches, opens a window, and is taken for the current one.

      Measured 2026-08-15: a stale binary carrying the framework's debug server
      put a second window on screen that was read as a defect in the first.
    cmds:
      - |
        for stale in bin/*; do
          case "$(basename "$stale")" in
            soksak|sok) ;;
            *) echo "removing $stale"; rm -rf "$stale" ;;
          esac
        done

  build:sok:
    summary: Builds the control-plane client
    desc: |
      `sok` is how anything outside the application drives it. It builds from
      this module so it derives the socket the same way the application does —
      a second spelling of "where does this installation live" would drift.

      It lands in bin/ beside everything else this repository produces. A copy
      built into a temporary directory is a copy nobody can rebuild the same
      way tomorrow.
    cmds:
      - go build -o bin/sok ./cmd/sok

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
