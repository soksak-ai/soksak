[package]
name = "soksak-pty-mirror"
version = "0.1.0"
edition = "2021"
description = "Headless terminal mirror and ANSI serializer for PTY session restore: consumes the raw output stream, never answers queries, and serializes the screen state (scrollback, alt screen, private modes) into replayable paint sequences."

