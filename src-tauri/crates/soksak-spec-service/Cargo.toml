[package]
name = "soksak-spec-service"
version = "0.1.0"
edition = "2021"
description = "Plugin service wire contract (soksak-spec-service@1) shared by the app and every plugin service binary: protocol version, stdio NDJSON frame set, closed error-code enum, bind-ledger types and path derivation, and supervision constants. No transport code. Behavioral law: docs/PLUGIN-SERVICE.md."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# hello 협상 문법(버전 판정 Compat/effective_protocol)은 소켓 프로토콜 계약을 재사용한다 —
# 판정 함수 사본 금지(soksak-spec-socket 이 정본).
soksak-spec-socket = { path = "../soksak-spec-socket" }
