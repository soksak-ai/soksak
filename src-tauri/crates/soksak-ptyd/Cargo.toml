[package]
name = "soksak-ptyd"
version = "0.1.0"
edition = "2021"
description = "PTY session daemon: owns shells and their children outside the app process so they survive app restarts, and serves attach/detach over identity-home sockets (soksak-spec-pty contract)."

[dependencies]
soksak-spec-pty = { path = "../soksak-spec-pty" }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# 봉인-블롭 저장소(X25519 sealed box) — 코어 secrets 와 같은 스킴의 단일 진실.
soksak-seal = { path = "../soksak-seal" }
