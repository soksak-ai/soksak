[package]
name = "soksak-pty-proto"
version = "0.1.0"
edition = "2021"
description = "PTY daemon protocol contract shared by the app and soksak-ptyd: version constant, socket/token/binary path derivation, hello grammar, message types, and the reply envelope. No transport code."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# hello 협상 문법(버전 판정 Compat/effective_protocol)은 소켓 프로토콜 계약을 재사용한다 —
# 판정 함수 사본 금지(soksak-protocol 이 정본).
soksak-protocol = { path = "../../protocol" }
