[package]
name = "soksak-spec-pty"
version = "0.0.1"
edition = "2021"
publish = false
description = "PTY daemon protocol contract shared by the app and soksak-ptyd: version constant, socket/token/binary path derivation, hello grammar, message types, and the reply envelope. No transport code."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 체크포인트 파일 stem(base64url(window|pane)) — 전단사 이름 파생(경로 규약의 일부).
base64 = "0.22"
# hello 협상 문법(버전 판정 Compat/effective_protocol)은 소켓 프로토콜 계약을 재사용한다 —
# 판정 함수 사본 금지(soksak-spec-socket 이 정본).
soksak-spec-socket = { path = "../soksak-spec-socket" }
