[workspace]
members = ["cli"]

[package]
# 기본(개발) 정체성. HMR(번들 안 됨)은 이 바이너리명이 독에 그대로 뜬다 → soksak-dev.
# 릴리스/디버그 번들은 빌드 시 --config 로 productName 을 soksak / soksak-debug 로 푼다.
name = "soksak-dev"
version = "0.0.1"
description = "soksak terminal"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "soksak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable: 창 안에 child webview 를 임베드(브라우저 패널)하는 Window::add_child 용.
# devtools: 브라우저 인스펙트 버튼(open_devtools) — release 빌드에도 Web Inspector 활성(개발자 도구 앱이라 기능).
tauri = { version = "2", features = ["protocol-asset", "unstable", "devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
tauri-plugin-dialog = "2.7.1"
# webview 캡처(DOM+WebGL, 가림 캡처) — 별도 저장소 플러그인(공개·재사용 의도). path 의존.
tauri-plugin-webview-capture = { path = "../../tauri-plugin-webview-capture" }
# 파일 트리 라이브 갱신용 파일시스템 워처(macOS=FSEvents, Linux=inotify, Win=ReadDirectoryChangesW).
# 폴링 없이 OS 네이티브 이벤트. debouncer-mini 로 변경 폭주를 묶는다.
notify-debouncer-mini = "0.6"
# 범용 임베디드 데이터 스토어(app.data) — 인프로세스 SQLite. bundled = SQLite amalgamation 동봉
# (FTS5 trigram = CJK 부분일치, JSON1). 별도 서버/포트 없음(멱등 부팅), 단일 .db 파일(VACUUM INTO 백업).
rusqlite = { version = "0.32", features = ["bundled"] }
# 알림 = 푸시 동급 1급 객체: OS 알림(비포커스 시 모바일식 푸시).
tauri-plugin-notification = "2"
# 딥링크 soksak:// URL 스킴 — 알림/외부 진입을 command URI 로 라우팅(콜드스타트 포함).
tauri-plugin-deep-link = "2"
# WebSocket capability(net.ws) — Origin 헤더 미전송(브라우저 WebSocket 은 Origin 강제 → webOS 등이 거부).
# ws:// 평문만(default-features=false → TLS 미포함, 가벼움). 양방향은 split sink/stream + Channel 스트리밍.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "io-util", "time", "macros"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
futures-util = "0.3"
# 클립보드 capability — 크로스플랫폼 텍스트 읽기/쓰기 + 변경 감시. 변경 감시는 OS별 네이티브 푸시
# 이벤트(Win=WM_CLIPBOARDUPDATE / X11=XFixes / Wayland=wl-data-control), macOS 만 NSPasteboard
# changeCount 폴링(이벤트 API 부재). clipboard-rs 가 4 백엔드를 단일 ClipboardHandler 로 흡수.
clipboard-rs = "0.2"

# HTTP 요청 capability(net.http.request) + 미디어 프록시(mediaproxy.rs). blocking 클라이언트(자체 런타임).
# native-tls 만(rustls 제거): 미디어 프록시는 OS 네이티브 TLS 로 fetch 해야 한다 — rustls 의 ClientHello 는
# JA3 핑거프린트가 비-브라우저로 잡혀 hotlink/봇차단 CDN 이 403 으로 거부(라이브 검증). native-tls(macOS
# Secure Transport)는 브라우저에 가까워 통과 — 레거시 Clean Player 와 동일 구성. Linux 는 OpenSSL 사용.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
# 미디어 프록시 임퍼소네이션 폴백 — native-tls 도 403 인 fingerprint 봇차단 CDN(Cloudflare/Akamai 의 JA3+
# HTTP/2 핑거프린트)을 위해. wreq(BoringSSL)가 Chrome 의 TLS+HTTP2 핸드셰이크를 정밀 위조해 통과(라이브
# 증명: native-tls 403, wreq 200). 모든 OS 동일 핑거프린트. async 전용 → 프록시(sync)에서 공용 tokio block_on.
wreq = "=6.0.0-rc.29"
wreq-util = "=3.0.0-rc.12"
# 딥링크 command URI(soksak://run?cmd=...) 파싱 — query 디코드. reqwest 트리에 이미 있어 추가 비용 0.
url = "2"

# 시크릿 볼트(app.secrets) — OS 키체인 비의존 순수 Rust crypto(KeePassXC/1Password 구조). 자체 crypto
# 발명 0, 검증된 RustCrypto crate 만. Argon2id(passphrase→KEK) + XChaCha20Poly1305(24B nonce AEAD,
# envelope: 항목별 DEK 를 KEK 로 wrap). rand=OsRng(salt/nonce/DEK), zeroize=KEK 메모리 소거.
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = "1"
# sha256 무결성 핀(runtime_dep: fetch reach 다운로드 검증). RustCrypto, 자체 crypto 0.
sha2 = "0.10"

# browser_eval: WKWebView callAsyncJavaScript 네이티브 콜백(결과 반환 eval — DOM 제어).
# wry 의존 트리와 동일 버전 사용.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-web-kit = { version = "0.3", features = ["block2"] }
# 신호등(트래픽 라이트) 44px 타이틀바 중앙 재배치 — wry inset_traffic_lights 로직 복제.
objc2-app-kit = "0.3"
block2 = "0.6"

# wry with_webview 프로세스 누수 수정 — soksak-ai/tauri fork(fix-with-webview-leak) 로 빌드.
# tauri 는 모노레포(형제 크레이트 path 의존)라 한 크레이트만 patch 하면 버전이 갈려 충돌한다 →
# 우리가 쓰는 tauri 계열 전체를 같은 포크로 물린다. 상류(tauri-apps/tauri) 머지 시 이 블록 제거.
[patch.crates-io]
tauri = { git = "https://github.com/soksak-ai/tauri", branch = "fix-with-webview-leak" }
tauri-build = { git = "https://github.com/soksak-ai/tauri", branch = "fix-with-webview-leak" }
tauri-codegen = { git = "https://github.com/soksak-ai/tauri", branch = "fix-with-webview-leak" }
tauri-macros = { git = "https://github.com/soksak-ai/tauri", branch = "fix-with-webview-leak" }
tauri-runtime = { git = "https://github.com/soksak-ai/tauri", branch = "fix-with-webview-leak" }
tauri-runtime-wry = { git = "https://github.com/soksak-ai/tauri", branch = "fix-with-webview-leak" }
tauri-utils = { git = "https://github.com/soksak-ai/tauri", branch = "fix-with-webview-leak" }

