[workspace]
members = ["cli", "crates/soksak-spec-contract", "crates/soksak-spec-socket", "crates/soksak-spec-pty", "crates/soksak-ptyd", "crates/soksak-seal", "crates/soksak-spec-service"]

[package]
# 기본(개발) 정체성. HMR(번들 안 됨)은 이 바이너리명이 독에 그대로 뜬다 → soksak-dev.
# 릴리스/디버그 번들은 빌드 시 --config 로 productName 을 soksak / soksak-debug 로 푼다.
name = "soksak-dev"
version = "0.0.1"
publish = false
description = "soksak terminal"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "soksak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 소켓 프로토콜 계약(버전 상수+호환창+순수 판정) — 앱과 sok 이 공히 의존, 상수 사본 금지.
soksak-spec-socket = { path = "crates/soksak-spec-socket" }
# 공개 계약 provider/consumer refs + SemVer range 판정 — sidecar/service가 공유하는 단일진실.
soksak-spec-contract = { path = "crates/soksak-spec-contract" }
# PTY 데몬 계약(버전·경로·hello·메시지) — pty.rs 라우터가 soksak-ptyd 와 공유, 상수 사본 금지.
soksak-spec-pty = { path = "crates/soksak-spec-pty" }
# X25519 sealed box 단일 진실 — 앱 볼트와 soksak-ptyd 체크포인트 공용.
soksak-seal = { path = "crates/soksak-seal" }
soksak-spec-service = { path = "crates/soksak-spec-service" }
uuid = { version = "1", features = ["v4"] }
# 프로세스 그룹 kill(process.rs group 스폰) — 직계 kill 은 손자(에이전트의 Bash 자식 등)를
# 남겨 stdout EOF·exit 가 지연된다. Unix 전용 사용(killpg).
libc = "0.2"
# unstable: 창 안에 child webview 를 임베드(브라우저 패널)하는 Window::add_child 용.
# devtools: 브라우저 인스펙트 버튼(open_devtools) — release 빌드에도 Web Inspector 활성(개발자 도구 앱이라 기능).
tauri = { version = "2", features = ["unstable", "devtools", "webview-data-url"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 사이드카(engine 모델) dylib 로더 — docs/SIDECARS.md. 모듈은 로드 후 unload 금지(의도적 leak).
libloading = "0.8"
portable-pty = "0.9"
base64 = "0.22"
tauri-plugin-dialog = "2.7.1"
# webview 캡처(DOM+WebGL, 가림 캡처) — 별도 저장소 플러그인(공개·재사용 의도). path 의존.
tauri-plugin-webview-capture = { path = "../../tauri-plugin-webview-capture" }
# 파일 트리 라이브 갱신용 파일시스템 워처(macOS=FSEvents, Linux=inotify, Win=ReadDirectoryChangesW).
# 폴링 없이 OS 네이티브 이벤트. debouncer-mini 로 변경 폭주를 묶는다.
notify-debouncer-mini = "0.6"
# 범용 임베디드 데이터 스토어(app.data) — 인프로세스 SQLite. bundled = SQLite amalgamation 동봉
# (FTS5 trigram = CJK 부분일치, JSON1). 별도 서버/포트 없음(멱등 부팅), 단일 .db 파일(VACUUM INTO 백업).
rusqlite = { version = "0.32", features = ["bundled"] }
# 알림 = 푸시 동급 1급 객체: OS 알림(비포커스 시 모바일식 푸시).
tauri-plugin-notification = "2"
# 딥링크 soksak:// URL 스킴 — 알림/외부 진입을 command URI 로 라우팅(콜드스타트 포함).
tauri-plugin-deep-link = "2"
# 자동 업데이트(release 채널만, HOME) — endpoint=gh release latest.json, minisign 서명 검증.
# 앱 본체 교체+relaunch 는 종료=보존(detach)+복원 사다리로 seamless. debug/dev 는 로컬 빌드라 미사용.
tauri-plugin-updater = "2"
# WebSocket capability(net.ws) — Origin 헤더 미전송(브라우저 WebSocket 은 Origin 강제 → webOS 등이 거부).
# ws:// 평문만(default-features=false → TLS 미포함, 가벼움). 양방향은 split sink/stream + Channel 스트리밍.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "io-util", "time", "macros", "process"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
futures-util = "0.3"
# 클립보드 capability — 크로스플랫폼 텍스트 읽기/쓰기 + 변경 감시. 변경 감시는 OS별 네이티브 푸시
# 이벤트(Win=WM_CLIPBOARDUPDATE / X11=XFixes / Wayland=wl-data-control), macOS 만 NSPasteboard
# changeCount 폴링(이벤트 API 부재). clipboard-rs 가 4 백엔드를 단일 ClipboardHandler 로 흡수.
clipboard-rs = "0.2"

# HTTP 요청 capability(net.http.request) + 미디어 프록시(mediaproxy.rs). blocking 클라이언트(자체 런타임).
# native-tls 만(rustls 제거): 미디어 프록시는 OS 네이티브 TLS 로 fetch 해야 한다 — rustls 의 ClientHello 는
# JA3 핑거프린트가 비-브라우저로 잡혀 hotlink/봇차단 CDN 이 403 으로 거부(라이브 검증). native-tls(macOS
# Secure Transport)는 브라우저에 가까워 통과 — 레거시 Clean Player 와 동일 구성. Linux 는 OpenSSL 사용.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
# 미디어 프록시 임퍼소네이션 폴백 — native-tls 도 403 인 fingerprint 봇차단 CDN(Cloudflare/Akamai 의 JA3+
# HTTP/2 핑거프린트)을 위해. wreq(BoringSSL)가 Chrome 의 TLS+HTTP2 핸드셰이크를 정밀 위조해 통과(라이브
# 증명: native-tls 403, wreq 200). 모든 OS 동일 핑거프린트. async 전용 → 프록시(sync)에서 공용 tokio block_on.
# stream feature = Response::bytes_stream(청크 스트리밍 — 큰 바디 버퍼링 0, 프록시가 1차로 씀).
wreq = { version = "=6.0.0-rc.29", features = ["stream"] }
wreq-util = "=3.0.0-rc.12"
# 딥링크 command URI(soksak://run?cmd=...) 파싱 — query 디코드. reqwest 트리에 이미 있어 추가 비용 0.
url = "2"

# 시크릿 볼트(app.secrets) — OS 키체인 비의존 순수 Rust crypto(KeePassXC/1Password 구조). 자체 crypto
# 발명 0, 검증된 RustCrypto crate 만. Argon2id(passphrase→KEK) + XChaCha20Poly1305(24B nonce AEAD,
# envelope: 항목별 DEK 를 KEK 로 wrap). rand=OsRng(salt/nonce/DEK), zeroize=KEK 메모리 소거.
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = "1"
# sha256 무결성 핀(runtime_dep: fetch reach 다운로드 검증). RustCrypto, 자체 crypto 0.
sha2 = "0.10"
# 플러그인 코드는 메인 renderer가 아니라 플러그인별 종료 가능한 helper process의
# raw Wry webview에서만 실행한다. tao는 helper의 이벤트 루프, wry는 opaque sandbox
# frame을 소유한다. 앱과 동일한 lockfile 버전을 정확히 고정해 webview 런타임을 갈라놓지 않는다.
tao = "=0.35.3"
wry = "=0.55.1"
# 검증된 tar.gz reader. 시스템 tar에 unpack을 위임하지 않고 archive entry를 코어가 하나씩
# 판정·작성해 symlink/hardlink/path traversal을 구조적으로 거부한다.
flate2 = "=1.1.9"
tar = "=0.4.46"
# app.data 비대칭 봉투의 X25519 sealed box 실체는 crates/soksak-seal 소유
# (x25519-dalek·hkdf 포함) — 앱은 soksak-seal 재수출만 소비한다.
# 폰-링크 원격 제어 스택(remote::* — iroh QUIC + snow Noise + Ed25519 기기 인증)은 원격 전송
# 사이드카 플러그인(vendor) 소유 — iroh/snow/ed25519-dalek 정적키 트리는 코어 바이너리에 없다.
# chacha20poly1305/rand/zeroize 는 secrets 볼트가 쓰므로 유지.

# browser_eval: WKWebView callAsyncJavaScript 네이티브 콜백(결과 반환 eval — DOM 제어).
# wry 의존 트리와 동일 버전 사용.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-web-kit = { version = "0.3", features = ["block2"] }
# 신호등(트래픽 라이트) 44px 타이틀바 중앙 재배치 — wry inset_traffic_lights 로직 복제.
objc2-app-kit = "0.3"
block2 = "0.6"
# wry with_webview ObjC retain 누수 수정 — 상류 머지됨(tauri-apps/tauri PR #15224, 2026-07-09 dev).
# 릴리스 판이 나올 때까지 머지 커밋 rev 를 고정해 상류로 빌드한다(떠다니는 dev 금지 — 재현성).
# tauri 는 모노레포(형제 크레이트 path 의존)라 한 크레이트만 patch 하면 버전이 갈려 충돌한다 →
# 우리가 쓰는 tauri 계열 전체를 같은 rev 로 물린다. 수정이 포함된 crates.io 릴리스가 나오면 이 블록 삭제.
[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "a370f653330506c2a5f59b643645a15b4cc30c18" }
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "a370f653330506c2a5f59b643645a15b4cc30c18" }
tauri-codegen = { git = "https://github.com/tauri-apps/tauri", rev = "a370f653330506c2a5f59b643645a15b4cc30c18" }
tauri-macros = { git = "https://github.com/tauri-apps/tauri", rev = "a370f653330506c2a5f59b643645a15b4cc30c18" }
tauri-runtime = { git = "https://github.com/tauri-apps/tauri", rev = "a370f653330506c2a5f59b643645a15b4cc30c18" }
tauri-runtime-wry = { git = "https://github.com/tauri-apps/tauri", rev = "a370f653330506c2a5f59b643645a15b4cc30c18" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri", rev = "a370f653330506c2a5f59b643645a15b4cc30c18" }

# 분포(release) 빌드 최적화 — 런타임 perf 수준은 유지(opt-level 은 release 기본 3)하면서 용량만 줄인다.
[profile.release]
strip = true       # 출하 바이너리에서 심볼 제거(가장 큰 단일 절감)
lto = "thin"       # 크레이트 간 dead-code 제거(thin = fat 에 근접하면서 빌드 더 빠름)
codegen-units = 1  # 단일 codegen unit → 최적화/중복제거 향상
